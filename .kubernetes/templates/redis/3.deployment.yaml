apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: '%NAMESPACE%'
  name: %NAMESPACE%-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      pod: %NAMESPACE%-redis-container
  template:
    metadata:
      namespace: '%NAMESPACE%'
      labels:
        app: %NAMESPACE%-redis
        pod: %NAMESPACE%-redis-container
    spec:
      containers:
        - name: %NAMESPACE%-redis
          image: redis:7.4.1
          imagePullPolicy: IfNotPresent
          # официальный образ не читает REDIS_PASSWORD — только аргументом redis-server
          command: ['sh', '-c', 'exec redis-server --requirepass "$REDIS_PASSWORD"']
          ports:
            - containerPort: 6379
          envFrom:
            - configMapRef:
                name: %NAMESPACE%-redis-config
          volumeMounts:
            - mountPath: /data
              name: %NAMESPACE%-redis-volume
          resources:
            requests:
              memory: 64Mi
              cpu: 70m
            limits:
              memory: 128Mi
              cpu: 200m
      volumes:
        - name: %NAMESPACE%-redis-volume
          persistentVolumeClaim:
            claimName: %NAMESPACE%-redis-pv-claim
